packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
  # Downloads the pinned Electron runtime required by Desktop build and E2E.
  electron: true
  # Windows-only transitive packager script; Desktop v0.1 packages macOS only.
  electron-winstaller: false
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  hono: ^4.12.32
  "@orpc/server": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/zod": ^1.14.12
  better-auth: 1.6.25
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  "@orpc/tanstack-query": ^1.14.12
  "@orpc/client": ^1.14.12
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-form": ^1.33.2
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
  tailwind-merge: ^3.6.0
  "@better-auth/expo": 1.6.25
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.37'
  - '@ai-sdk/gateway@4.0.47'
  - '@ai-sdk/openai-compatible@3.0.29'
  - '@ai-sdk/provider-utils@5.0.26'
  - ai@7.0.59
